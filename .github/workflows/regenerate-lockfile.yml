name: Regenerate npm lockfile

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/regenerate-lockfile.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/upgrade-nextjs-patched-and-lockfile'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to this PR branch
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): regenerate npm lockfile"
            git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
          fi
      - name: Upload generated lockfile for inspection
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-package-lock
          path: package-lock.json
          retention-days: 2
