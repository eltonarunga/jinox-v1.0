name: CI Pipeline

on:
  push:
  pull_request:
    branches: [ "main", "master" ]

# CI only needs to read repository contents. Keep the default token least-privileged.
permissions:
  contents: read

# Avoid wasting runner capacity on superseded commits for the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Unit Tests
        run: npm run test:unit

      - name: Staging Authorization Integration Tests
        run: npm run test:integration

      - name: Type Check
        run: npm run type-check

      - name: Lint Codebase
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
